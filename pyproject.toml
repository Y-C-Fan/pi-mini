[project]
name = "pi-mini"
version = "0.0.1"
description = "Hand-written mini reimplementation of the Pi agent harness, for learning"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pi-mini = "pi_mini.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_mini"]
